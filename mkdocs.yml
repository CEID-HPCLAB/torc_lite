site_name: Torc-Lite Documentation
site_description: Task-parallel runtime for MPI clusters and multicore systems, developed by Panagiotis E. Hadjidoukas
site_url: https://ceid-hpclab.github.io/torc_lite/
repo_url: https://github.com/CEID-HPCLAB/torc_lite
repo_name: CEID-HPCLAB/torc_lite
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
copyright: Torc-Lite — Panagiotis E. Hadjidoukas · CEID-HPCLAB, University of Patras

strict: true

theme:
  name: material
  language: en
  icon:
    logo: material/source-branch
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Get started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First program: getting-started/first-program.md
      - Build options and environment: getting-started/configuration.md
  - Programming guide:
      - Architecture: concepts/architecture.md
      - Program lifecycle: concepts/lifecycle.md
      - Task arguments and data movement: concepts/arguments.md
      - Scheduling and work stealing: concepts/scheduling.md
      - Nested parallelism: concepts/nested-parallelism.md
      - MPI interoperability: concepts/mpi.md
      - Performance considerations: concepts/performance.md
  - API:
      - Overview: api/index.md
      - C reference: api/c.md
      - Fortran interface: api/fortran.md
      - Current C header: generated/headers/torc.md
      - Current Fortran header: generated/headers/torcf.md
  - Examples:
      - Introduction: examples/index.md
      - Master–worker: examples/masterworker.md
      - Recursive Fibonacci: examples/fibonacci.md
      - Data exchange and broadcasts: examples/data.md
      - Advanced/experimental: examples/advanced.md
      - Demo source index: generated/examples/index.md
      - Master–worker source: generated/examples/masterslave.md
      - Fibonacci source: generated/examples/fibo.md
      - Broadcast source: generated/examples/broadcast.md
      - Struct source: generated/examples/struct.md
      - Zero-length source: generated/examples/zerolength.md
      - Asynchronous source: generated/examples/async.md
      - Pipeline source: generated/examples/pipe.md
      - Microbenchmark source: generated/examples/mbench1.md
  - Guides:
      - Fortran programs: guides/fortran.md
      - Migrating task loops: guides/migrating.md
      - Common problems: guides/troubleshooting.md
  - Research & ecosystem:
      - TorcPy: research/torcpy.md
      - Research applications: research/applications.md
      - Historical scheduling studies: research/scheduling-studies.md
      - Publications: research/publications.md
      - Authorship and project history: research/about.md
